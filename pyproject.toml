[project]
name = "chop-evaluation"
version = "0.1.0"
description = "Reproducible evaluation entry points for ICON-CHOP experiments"
readme = "eval/README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  # Core evaluation dependencies
  "arrow>=1.3.0",
  "bresenham>=0.2.0",
  "einops>=0.8.1",
  "filelock>=3.13.0",
  "geopy>=2.4.0",
  "h5py>=3.13.0",
  "hydra-core>=1.3",
  "lightning>=2.5",
  "matplotlib>=3.10.3",
  "metpy>=1.6.0",
  "netCDF4>=1.7.0",
  "numpy>=2.2",
  "omegaconf>=2.3",
  "optree>=0.19.0",
  "packaging>=20.0",
  "pandas>=2.2",
  "pillow>=11.0.0",
  "pint>=0.24",
  "pydantic>=2.11",
  "pydantic-settings>=2.8",
  "python-dotenv>=1.2.2",
  "PyYAML>=6.0.2",
  "rich>=14.0",
  "scipy>=1.15",
  "setuptools>=80.9.0",
  "torch>=2.7.0",
  "torchmetrics>=1.7.0",
  "transformers>=4.53",
  "typer>=0.16",
  "typing-extensions>=4.12",
  "xarray>=2024.10.0",
]

[dependency-groups]
dev = [
  "pre-commit>=4.2",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-httpx>=0.35",
  "pytest-xdist>=3.6",
  "ruff>=0.11",
  "types-PyYAML>=6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101"]

[tool.uv]
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython'",
]
link-mode = "copy"
package = false
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures/repos"]
pythonpath = ["src"]
markers = [
  "integration: slower cross-module tests",
  "live: requires external API key or manual trigger",
]
