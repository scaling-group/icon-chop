[project]
name = "icon-chop-mfc-2d"
version = "0.1.0"
description = "Inference-time ICON CHOP chain task for hidden 2D MFC operators."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "einops>=0.8.1",
    "h5py>=3.13.0",
    "hydra-core>=1.3.2",
    "lightning>=2.5",
    "matplotlib>=3.10.3",
    "numpy>=2.2.4",
    "pyyaml>=6.0.3",
    "torch>=2.7.0",
]

[tool.uv]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'"
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
exclude = ["reference/*", "deprecated/*"]

target-version = "py311"
line-length = 120
indent-width = 4

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = [
    # "E402", # module level import not at top of file
    # "E501", # line too long
    # "E741", # ambiguous variable name
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
